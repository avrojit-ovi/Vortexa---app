name: Android CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, test and assemble
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Static checks and unit tests
        run: ./gradlew --no-daemon --stacktrace check testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vortexa-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  release:
    name: Signed release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.VORTEXA_KEYSTORE_BASE64 }}
        run: |
          mkdir -p .secret
          echo "$KEYSTORE_BASE64" | base64 -d > .secret/vortexa-release.jks

      - name: Write keystore.properties
        env:
          STORE_PASSWORD: ${{ secrets.VORTEXA_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.VORTEXA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.VORTEXA_KEY_PASSWORD }}
        run: |
          cat > keystore.properties <<PROPS
          storeFile=.secret/vortexa-release.jks
          storePassword=${STORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          PROPS

      - name: Build signed APK and AAB
        run: ./gradlew --no-daemon :app:assembleRelease :app:bundleRelease

      - name: Upload signed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vortexa-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Attach to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          generate_release_notes: true
