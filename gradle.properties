# ---------------------------------------------------------------------------
# Gradle
# ---------------------------------------------------------------------------
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.warning.mode=all

# ---------------------------------------------------------------------------
# Android
# ---------------------------------------------------------------------------
android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false

# ---------------------------------------------------------------------------
# Kotlin
# ---------------------------------------------------------------------------
kotlin.code.style=official

# ---------------------------------------------------------------------------
# Branding - SINGLE SOURCE OF TRUTH for the app identity.
# Change the name/package here and every module picks it up.
# ---------------------------------------------------------------------------
vortexa.appName=Vortexa
vortexa.appId=com.vortexa.app
vortexa.versionCode=3
vortexa.versionName=0.3.0
